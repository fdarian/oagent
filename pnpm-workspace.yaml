packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msgpackr-extract: true

enableGlobalVirtualStore: true

catalog:
  '@effect/platform-bun': 4.0.0
  '@modelcontextprotocol/server': ^2.3.0
  '@orpc/client': 2.0.0-beta.21
  '@orpc/experimental-effect': 2.0.0-beta.21
  '@orpc/server': 2.0.0-beta.21
  '@orpc/tanstack-query': 2.0.0-beta.21
  effect: 4.0.1
  typescript: ^7.0.2
  zod: ^4.6.5

minimumReleaseAgeExclude:
  - ccusage-lib@0.1.0
